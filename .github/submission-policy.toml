# Правила бота заявок (scripts/submission.py).
# Мейнтейнеры (владелец и коллабораторы с правом записи) проходят без проверок.

# Минимальный возраст GitHub-аккаунта автора заявки, дней.
# Авторы, у которых уже есть смёрженный PR в этом репозитории, освобождены.
min_account_age_days = 14

# Сколько доменов можно прислать в одной заявке.
max_domains_per_issue = 10

# Лимиты на автора: одновременно открытых заявок и заявок за 30 дней.
max_open_submissions = 2
max_submissions_per_30_days = 5

# Мягкий сигнал: аккаунт моложе стольких дней и без публичных репозиториев.
# Заявка обрабатывается, но PR получает метку needs-manual-review.
young_account_days = 60

# Логины GitHub, которым запрещено присылать заявки.
blocked_users = []

# Домены, которые нельзя добавлять никогда (вместе с поддоменами).
blocked_domains = []
