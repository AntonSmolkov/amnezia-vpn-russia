name: Добавить сайт в список
description: Российский сайт не открывается с VPN, и его нет в списке. Бот проверит домены и сам откроет pull request.
title: "Добавить сайт: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Бот проверит каждый домен автоматически:
        - домен существует и его ещё нет в списке;
        - сайт **не заблокирован в РФ** — мимо VPN заблокированный сайт не откроется;
        - у сайта есть **российские IP-адреса**. Сайты только на Cloudflare и других зарубежных CDN добавить нельзя: их адреса делят тысячи чужих сайтов.

        Если всё в порядке, бот откроет pull request, а мейнтейнер его примет. Ошибки можно исправить, отредактировав эту заявку, — проверка запустится заново.
  - type: textarea
    id: domains
    attributes:
      label: Домены
      description: По одному на строку, до 10 штук. Можно вставлять ссылки — бот сам выделит домен. Поддомены вроде `lk.zakupki.gov.ru` указывайте отдельно, вариант с `www.` — не нужно.
      placeholder: |
        zakupki.gov.ru
        lk.zakupki.gov.ru
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Категория
      options:
        - 1. Банки, финансы и страхование
        - 2. Госуслуги и госорганы
        - 3. Маркетплейсы, магазины и доставка еды
        - 4. Технологии, поиск, соцсети и ПО
        - 5. Медиа, ТВ, стриминг и спорт
        - 6. Транспорт, путешествия и логистика
        - 7. Телеком
        - 8. Образование
        - 9. Медицина и аптеки
        - 10. Недвижимость, авто, работа и услуги
        - 11. Крупные компании и промышленность
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что не работает через VPN
      description: Капча, «доступ из-за рубежа запрещён», бесконечная загрузка, ошибка входа…
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Подтверждения
      options:
        - label: Это российский сайт или сервис
          required: true
        - label: Без VPN этот сайт открывается — он не заблокирован в России
          required: true
